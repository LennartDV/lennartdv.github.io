<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build Planner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-field {
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Tab Animations */
        .tab-btn {
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 pb-32">

    <!-- Header -->
    <header class="w-full max-w-2xl mb-4 text-center">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
            <i class="fa-solid fa-microchip mr-2"></i>Build Planner
        </h1>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl flex flex-col gap-6">

        <!-- Tabs Section -->
        <div class="w-full">
            <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Your Builds</label>
                <button onclick="createNewBuild()" class="text-xs text-cyan-400 hover:text-cyan-300 font-bold uppercase tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> New Build
                </button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2" id="tabsContainer">
                <!-- Tabs injected by JS -->
            </div>
        </div>
        
        <!-- Input Form -->
        <div class="glass-panel rounded-2xl p-5 shadow-xl border-t-4 border-t-cyan-500">
            <form id="partForm" class="flex flex-col gap-4">
                <input type="hidden" id="editId">
                
                <div class="flex justify-between items-end">
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider" id="formTitle">Add Component</label>
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden text-xs text-red-400 hover:text-red-300 mb-1">Cancel Edit</button>
                </div>

                <!-- Component Name -->
                <div>
                    <input type="text" id="partName" placeholder="Component Name (e.g. RTX 4070)" required
                        class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 placeholder-slate-500 font-semibold">
                </div>

                <div class="flex gap-4">
                    <!-- Price -->
                    <div class="w-1/3">
                        <input type="number" id="partPrice" placeholder="Price €" step="0.01" required
                            class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 placeholder-slate-500">
                    </div>

                    <!-- Link -->
                    <div class="w-2/3 relative">
                        <input type="text" id="partLink" placeholder="Link URL"
                            class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-3 placeholder-slate-500">
                        <i class="fa-solid fa-link absolute left-3.5 top-3.5 text-slate-500"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                    class="mt-2 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95 shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add to List
                </button>
            </form>
        </div>

        <!-- Parts List -->
        <div id="listContainer" class="flex flex-col gap-3">
            <!-- Items injected by JS -->
        </div>

        <!-- Delete Build Danger Zone -->
        <div class="mt-8 pt-8 border-t border-slate-800 flex justify-center">
             <button onclick="deleteCurrentBuild()" class="text-red-500/50 hover:text-red-500 text-sm flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-trash"></i> Delete this entire build
            </button>
        </div>

    </main>

    <!-- Sticky Footer Total -->
    <div class="fixed bottom-6 w-full max-w-2xl px-4 z-50">
        <div class="glass-panel rounded-xl p-4 shadow-2xl flex justify-between items-center border-t border-cyan-500/30 bg-slate-900/90">
            <div class="flex flex-col">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider" id="activeBuildName">Current Build</span>
                <span class="text-xs text-slate-500" id="itemCount">0 items</span>
            </div>
            <div class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500" id="totalPrice">
                0,00 €
            </div>
        </div>
    </div>

    <script>
        // --- Constants & Config ---
        const STORAGE_KEY = 'pc_builds_data_v2';
        const PRESET_COMPONENTS = [
            'CPU', 'CPU Cooler', 'Motherboard', 'Memory (RAM)', 
            'Storage', 'Video Card (GPU)', 'Case', 'Power Supply'
        ];

        // --- State ---
        let builds = [];
        let activeBuildId = null;
        let editingPartId = null;

        // --- DOM Elements ---
        const form = document.getElementById('partForm');
        const listContainer = document.getElementById('listContainer');
        const tabsContainer = document.getElementById('tabsContainer');
        const totalPriceEl = document.getElementById('totalPrice');
        const itemCountEl = document.getElementById('itemCount');
        const activeBuildNameEl = document.getElementById('activeBuildName');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            if (builds.length === 0) {
                createNewBuild('My First Build');
            } else {
                // Default to first build if none active
                if (!activeBuildId || !builds.find(b => b.id === activeBuildId)) {
                    activeBuildId = builds[0].id;
                }
            }
            renderApp();
        });

        // --- Core Logic ---

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                builds = data.builds || [];
                activeBuildId = data.activeId || null;
            }
        }

        function saveData() {
            const data = {
                builds: builds,
                activeId: activeBuildId
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderApp();
        }

        function createNewBuild(nameOverride = null) {
            const name = nameOverride || prompt("Enter a name for the new build:", "New Gaming PC");
            if (!name) return;

            const newBuild = {
                id: Date.now().toString(),
                name: name,
                parts: PRESET_COMPONENTS.map((compName, index) => ({
                    id: Date.now() + index, // unique IDs
                    name: compName,
                    price: 0,
                    link: '',
                    isPreset: true // Mark as a placeholder
                }))
            };

            builds.push(newBuild);
            activeBuildId = newBuild.id;
            saveData();
        }

        function deleteCurrentBuild() {
            if (builds.length <= 1) {
                alert("You must have at least one build.");
                return;
            }
            if (confirm("Are you sure you want to delete this entire build? This cannot be undone.")) {
                builds = builds.filter(b => b.id !== activeBuildId);
                activeBuildId = builds[0].id;
                saveData();
            }
        }

        function switchTab(id) {
            activeBuildId = id.toString();
            cancelEdit(); // Stop editing if switching tabs
            saveData();
        }

        // --- Form Logic ---

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('partName');
            const priceInput = document.getElementById('partPrice');
            const linkInput = document.getElementById('partLink');

            let linkUrl = linkInput.value.trim();
            if (linkUrl && !linkUrl.match(/^https?:\/\//i)) {
                linkUrl = 'https://' + linkUrl;
            }

            const currentBuild = builds.find(b => b.id === activeBuildId);
            if (!currentBuild) return;

            if (editingPartId) {
                // Update Existing
                const part = currentBuild.parts.find(p => p.id === editingPartId);
                if (part) {
                    part.name = nameInput.value.trim();
                    part.price = parseFloat(priceInput.value);
                    part.link = linkUrl;
                    part.isPreset = false; // It's a real part now
                }
            } else {
                // Add New
                const newPart = {
                    id: Date.now(),
                    name: nameInput.value.trim(),
                    price: parseFloat(priceInput.value),
                    link: linkUrl,
                    isPreset = false
                };
                currentBuild.parts.push(newPart);
            }

            cancelEdit();
            saveData();
        });

        function editPart(partId) {
            const currentBuild = builds.find(b => b.id === activeBuildId);
            const part = currentBuild.parts.find(p => p.id === partId);
            if (!part) return;

            editingPartId = partId;
            
            // Populate form
            document.getElementById('partName').value = part.name;
            document.getElementById('partPrice').value = part.price === 0 ? '' : part.price;
            document.getElementById('partLink').value = part.link;

            // UI Changes
            submitBtn.innerHTML = `<i class="fa-solid fa-check"></i> Update Component`;
            submitBtn.classList.remove('bg-slate-700', 'hover:bg-slate-600');
            submitBtn.classList.add('bg-cyan-600', 'hover:bg-cyan-500');
            
            formTitle.textContent = "Editing Component";
            formTitle.classList.add('text-cyan-400');
            cancelEditBtn.classList.remove('hidden');

            document.getElementById('partName').focus();
            
            // Smooth scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingPartId = null;
            form.reset();
            
            // Reset UI
            submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Add to List`;
            submitBtn.classList.add('bg-slate-700', 'hover:bg-slate-600');
            submitBtn.classList.remove('bg-cyan-600', 'hover:bg-cyan-500');
            
            formTitle.textContent = "Add Component";
            formTitle.classList.remove('text-cyan-400');
            cancelEditBtn.classList.add('hidden');
        }

        function deletePart(partId) {
            const currentBuild = builds.find(b => b.id === activeBuildId);
            if (currentBuild) {
                currentBuild.parts = currentBuild.parts.filter(p => p.id !== partId);
                // If user deletes item being edited, cancel edit
                if (editingPartId === partId) cancelEdit();
                saveData();
            }
        }

        // --- Rendering ---

        function renderApp() {
            renderTabs();
            renderList();
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            builds.forEach(build => {
                const isActive = build.id === activeBuildId;
                const btn = document.createElement('button');
                btn.onclick = () => switchTab(build.id);
                btn.className = `tab-btn px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 whitespace-nowrap ${
                    isActive 
                    ? 'active bg-slate-800 text-cyan-400 border-cyan-500/50' 
                    : 'bg-slate-800/50 text-slate-400 hover:bg-slate-700'
                }`;
                btn.textContent = build.name;
                tabsContainer.appendChild(btn);
            });
        }

        function renderList() {
            listContainer.innerHTML = '';
            const currentBuild = builds.find(b => b.id === activeBuildId);
            
            if (!currentBuild) return;

            activeBuildNameEl.textContent = currentBuild.name;

            let total = 0;

            if (currentBuild.parts.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-500">
                        <i class="fa-solid fa-layer-group text-4xl mb-3 opacity-50"></i>
                        <p>No parts in this build.</p>
                    </div>
                `;
            } else {
                currentBuild.parts.forEach(part => {
                    total += part.price;
                    const card = document.createElement('div');
                    
                    // Style adjustments for "Preset" items (placeholders)
                    const isPreset = part.isPreset || false;
                    const opacityClass = isPreset ? 'opacity-70 hover:opacity-100' : 'opacity-100';
                    const bgClass = isPreset ? 'bg-slate-800/40 border-slate-700/50 border-dashed' : 'glass-panel';
                    
                    card.className = `${bgClass} ${opacityClass} p-4 rounded-xl flex items-center justify-between group transition-all relative border`;
                    
                    const formattedPrice = part.price > 0 ? new Intl.NumberFormat('de-DE', { 
                        style: 'currency', 
                        currency: 'EUR' 
                    }).format(part.price) : '<span class="text-slate-600 text-sm">--</span>';

                    // Link Button
                    const linkButton = part.link 
                        ? `<a href="${part.link}" target="_blank" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-cyan-600 text-cyan-400 hover:text-white flex items-center justify-center transition-colors">
                             <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                           </a>`
                        : `<div class="w-9 h-9 rounded-full bg-slate-800/50 text-slate-700 flex items-center justify-center cursor-default">
                             <i class="fa-solid fa-link-slash text-sm"></i>
                           </div>`;

                    card.innerHTML = `
                        <div class="flex-1 mr-4">
                            <h3 class="font-semibold ${isPreset ? 'text-slate-300' : 'text-white'} text-lg leading-tight">
                                ${escapeHtml(part.name)}
                                ${isPreset ? '<span class="ml-2 text-[10px] uppercase bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded">Required</span>' : ''}
                            </h3>
                            <p class="${isPreset ? 'text-slate-500' : 'text-emerald-400'} font-mono font-medium mt-1">${formattedPrice}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${linkButton}
                            
                            <button onclick="editPart(${part.id})" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-blue-600 text-slate-400 hover:text-white flex items-center justify-center transition-colors" title="Edit Component">
                                <i class="fa-solid fa-pencil text-sm"></i>
                            </button>

                            <button onclick="deletePart(${part.id})" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-red-500/20 text-slate-400 hover:text-red-400 flex items-center justify-center transition-colors" title="Remove Component">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }

            // Update Total
            totalPriceEl.textContent = new Intl.NumberFormat('de-DE', { 
                style: 'currency', 
                currency: 'EUR' 
            }).format(total);

            itemCountEl.textContent = `${currentBuild.parts.length} items`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>
</body>
</html>
