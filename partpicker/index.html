<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-field {
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Modal Styles */
        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
        }

        /* Tab Styles */
        .tab-active {
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border-color: #38bdf8;
        }
        .tab-inactive {
            color: #94a3b8;
            border-color: transparent;
        }
        .tab-inactive:hover {
            color: #cbd5e1;
            background-color: rgba(30, 41, 59, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 pb-28">

    <!-- Header -->
    <header class="w-full max-w-2xl mb-6 text-center relative">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
            <i class="fa-solid fa-microchip mr-2"></i>PC Build Planner
        </h1>
        <div class="absolute right-0 top-1">
            <button onclick="openSettings()" class="text-slate-400 hover:text-white transition-colors" title="Settings & Backup">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-2xl flex flex-col gap-6">

        <!-- Tabs Section -->
        <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Your Builds</span>
                <button onclick="createNewBuild()" class="text-xs text-cyan-400 hover:text-cyan-300 font-bold uppercase tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> New Build
                </button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-2" id="tabsContainer">
                <!-- Tabs injected here -->
            </div>
        </div>
        
        <!-- Input Form -->
        <div class="glass-panel rounded-2xl p-5 shadow-xl border-t-2 border-slate-700 relative">
            
            <!-- Edit Mode Indicator -->
            <div id="editModeIndicator" class="hidden absolute -top-3 left-1/2 transform -translate-x-1/2 bg-cyan-600 text-white text-xs px-3 py-1 rounded-full font-bold shadow-lg">
                Editing Component
            </div>

            <form id="partForm" class="flex flex-col gap-4">
                <input type="hidden" id="editId" value="">

                <!-- Component Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Component</label>
                    <input type="text" id="partName" placeholder="e.g. NVIDIA RTX 4070" required
                        class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 placeholder-slate-500">
                </div>

                <div class="flex gap-4">
                    <!-- Price -->
                    <div class="w-1/3">
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Price (€)</label>
                        <input type="number" id="partPrice" placeholder="0.00" step="0.01" required
                            class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 placeholder-slate-500">
                    </div>

                    <!-- Link -->
                    <div class="w-2/3">
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Link URL</label>
                        <div class="relative">
                            <input type="text" id="partLink" placeholder="amazon.de/..."
                                class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-3 placeholder-slate-500">
                            <i class="fa-solid fa-link absolute left-3.5 top-3.5 text-slate-500"></i>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95 shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add Component
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-1/4 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition-all">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- Parts List -->
        <div id="listContainer" class="flex flex-col gap-3">
            <!-- Items will be injected here by JS -->
            <div id="emptyState" class="text-center py-10 text-slate-500 hidden">
                <i class="fa-solid fa-layer-group text-4xl mb-3 opacity-50"></i>
                <p>No parts added yet.</p>
            </div>
        </div>

        <div class="text-center mt-4">
             <button onclick="deleteCurrentBuild()" class="text-red-900 hover:text-red-500 text-xs transition-colors">Delete this build</button>
        </div>

    </main>

    <!-- Sticky Footer Total -->
    <div class="fixed bottom-6 w-full max-w-2xl px-4 z-40">
        <div class="glass-panel rounded-xl p-4 shadow-2xl flex justify-between items-center border-t border-cyan-500/30 bg-slate-900/95">
            <div class="flex flex-col">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider" id="activeBuildLabel">Total Budget</span>
                <span class="text-xs text-slate-500" id="itemCount">0 items</span>
            </div>
            <div class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500" id="totalPrice">
                0,00 €
            </div>
        </div>
    </div>

    <!-- Data Modal (Import/Export) -->
    <div id="dataModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-lg shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white">Import / Export</h2>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- File Operations -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <!-- Download -->
                <button onclick="downloadDataFile()" class="flex flex-col items-center justify-center bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-cyan-500/50 rounded-xl p-4 transition-all group">
                    <i class="fa-solid fa-download text-2xl text-cyan-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="text-sm font-semibold text-slate-200">Download File</span>
                    <span class="text-xs text-slate-500">Save backup (.txt)</span>
                </button>

                <!-- Upload -->
                <label class="cursor-pointer flex flex-col items-center justify-center bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-emerald-500/50 rounded-xl p-4 transition-all group">
                    <i class="fa-solid fa-file-import text-2xl text-emerald-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="text-sm font-semibold text-slate-200">Import File</span>
                    <span class="text-xs text-slate-500">Load backup (.txt)</span>
                    <input type="file" id="fileInput" onchange="importDataFile(this)" accept=".txt,.json" class="hidden">
                </label>
            </div>

            <!-- Manual Copy Paste Section -->
            <div class="border-t border-slate-800 pt-4">
                <button onclick="toggleManualMode()" class="flex items-center gap-2 text-xs text-slate-500 hover:text-slate-300 transition-colors w-full justify-center">
                    <span>Or copy/paste manually</span>
                    <i class="fa-solid fa-chevron-down" id="manualChevron"></i>
                </button>
                
                <div id="manualSection" class="hidden mt-4">
                    <textarea id="dataExportArea" class="w-full h-24 bg-slate-950 border border-slate-700 text-xs text-slate-300 rounded-lg p-3 font-mono focus:outline-none focus:border-cyan-500 mb-3" readonly></textarea>
                    
                    <button onclick="copyToClipboard()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-sm font-medium transition-colors mb-4 border border-slate-700">
                        <i class="fa-regular fa-copy mr-2"></i>Copy Text
                    </button>

                    <p class="text-xs text-slate-500 mb-1">Paste Data to Import:</p>
                    <div class="flex gap-2">
                        <input type="text" id="manualInput" class="flex-1 bg-slate-950 border border-slate-700 text-xs text-white rounded-lg px-3 py-2 font-mono focus:outline-none focus:border-cyan-500" placeholder="Paste data string...">
                        <button onclick="importManualData()" class="bg-red-900/50 hover:bg-red-600 border border-red-900 hover:border-red-500 text-red-200 hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition-all">
                            Load
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- State Management ---
        const STORAGE_KEY = 'pc_planner_v3';
        let appData = {
            builds: [
                { id: 'default', name: 'My Build', parts: [] }
            ],
            activeBuildId: 'default'
        };

        // --- DOM Elements ---
        const form = document.getElementById('partForm');
        const listContainer = document.getElementById('listContainer');
        const emptyState = document.getElementById('emptyState');
        const totalPriceEl = document.getElementById('totalPrice');
        const itemCountEl = document.getElementById('itemCount');
        const tabsContainer = document.getElementById('tabsContainer');
        const activeBuildLabel = document.getElementById('activeBuildLabel');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editModeIndicator = document.getElementById('editModeIndicator');

        // Modal Elements
        const dataModal = document.getElementById('dataModal');
        const dataExportArea = document.getElementById('dataExportArea');
        const manualSection = document.getElementById('manualSection');
        const manualChevron = document.getElementById('manualChevron');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderApp();
        });

        // --- Data Logic ---
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Migration support if old version
                    if (Array.isArray(parsed)) {
                         appData.builds[0].parts = parsed; // Convert old array to new structure
                    } else {
                        appData = parsed;
                    }
                } catch(e) {
                    console.error("Save data corrupted", e);
                }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            renderApp();
        }

        function getActiveBuild() {
            return appData.builds.find(b => b.id === appData.activeBuildId) || appData.builds[0];
        }

        // --- Build/Tab Management ---
        function createNewBuild() {
            const name = prompt("Name for new build:", "New PC");
            if (name) {
                const newId = Date.now().toString();
                appData.builds.push({ id: newId, name: name, parts: [] });
                appData.activeBuildId = newId;
                saveData();
            }
        }

        function switchTab(id) {
            appData.activeBuildId = id;
            cancelEdit();
            saveData();
        }

        function renameTab(id) {
            const build = appData.builds.find(b => b.id === id);
            if (!build) return;
            const newName = prompt("Rename build:", build.name);
            if (newName) {
                build.name = newName;
                saveData();
            }
        }

        function deleteCurrentBuild() {
            if (appData.builds.length <= 1) {
                alert("You cannot delete the only build.");
                return;
            }
            if(confirm("Delete this build permanently?")) {
                appData.builds = appData.builds.filter(b => b.id !== appData.activeBuildId);
                appData.activeBuildId = appData.builds[0].id;
                saveData();
            }
        }

        // --- Part Management ---
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const build = getActiveBuild();
            const idInput = document.getElementById('editId');
            const nameInput = document.getElementById('partName');
            const priceInput = document.getElementById('partPrice');
            const linkInput = document.getElementById('partLink');

            let linkUrl = linkInput.value.trim();
            if (linkUrl && !linkUrl.match(/^https?:\/\//i)) {
                linkUrl = 'https://' + linkUrl;
            }

            if (idInput.value) {
                // Edit existing
                const part = build.parts.find(p => p.id == idInput.value);
                if (part) {
                    part.name = nameInput.value.trim();
                    part.price = parseFloat(priceInput.value);
                    part.link = linkUrl;
                }
            } else {
                // Add new
                const newPart = {
                    id: Date.now(),
                    name: nameInput.value.trim(),
                    price: parseFloat(priceInput.value),
                    link: linkUrl
                };
                build.parts.push(newPart);
            }

            cancelEdit();
            saveData();
        });

        function deletePart(id) {
            const build = getActiveBuild();
            build.parts = build.parts.filter(part => part.id !== id);
            saveData();
        }

        function editPart(id) {
            const build = getActiveBuild();
            const part = build.parts.find(p => p.id === id);
            if(!part) return;

            document.getElementById('editId').value = part.id;
            document.getElementById('partName').value = part.name;
            document.getElementById('partPrice').value = part.price;
            document.getElementById('partLink').value = part.link;

            // UI Mode Switch
            submitBtn.innerHTML = `<i class="fa-solid fa-save"></i> Save Changes`;
            submitBtn.classList.remove('from-blue-600', 'to-cyan-600');
            submitBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            cancelEditBtn.classList.remove('hidden');
            editModeIndicator.classList.remove('hidden');
            
            document.getElementById('partName').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            form.reset();
            document.getElementById('editId').value = "";
            
            submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Add Component`;
            submitBtn.classList.add('from-blue-600', 'to-cyan-600');
            submitBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
            cancelEditBtn.classList.add('hidden');
            editModeIndicator.classList.add('hidden');
        }

        // --- Import / Export Logic ---
        function openSettings() {
            // Pre-fill text area just in case
            dataExportArea.value = JSON.stringify(appData);
            dataModal.classList.remove('hidden');
        }

        function closeSettings() {
            dataModal.classList.add('hidden');
            // Reset manual section visibility if desired, or keep state
        }

        // 1. Download File
        function downloadDataFile() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // Format date for filename
            const date = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `pc_build_backup_${date}.txt`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 2. Import File
        function importDataFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    processImport(content);
                } catch(err) {
                    alert("Error reading file: " + err);
                }
            };
            reader.readAsText(file);
            input.value = ''; // Reset so same file works again
        }

        // 3. Manual Copy/Paste Fallback
        function toggleManualMode() {
            const isHidden = manualSection.classList.contains('hidden');
            if (isHidden) {
                manualSection.classList.remove('hidden');
                manualChevron.classList.remove('fa-chevron-down');
                manualChevron.classList.add('fa-chevron-up');
            } else {
                manualSection.classList.add('hidden');
                manualChevron.classList.add('fa-chevron-down');
                manualChevron.classList.remove('fa-chevron-up');
            }
        }

        function copyToClipboard() {
            dataExportArea.select();
            document.execCommand('copy');
            const btn = document.querySelector('#manualSection button i');
            btn.className = 'fa-solid fa-check mr-2';
            setTimeout(() => { btn.className = 'fa-regular fa-copy mr-2'; }, 1000);
        }

        function importManualData() {
            const input = document.getElementById('manualInput').value;
            if(!input) return;
            processImport(input);
            document.getElementById('manualInput').value = '';
        }

        // Core Import Processor
        function processImport(jsonString) {
            try {
                const parsed = JSON.parse(jsonString);
                
                // Basic validation
                let validData = null;

                if (parsed.builds && Array.isArray(parsed.builds)) {
                    // New Format
                    validData = parsed;
                } else if (Array.isArray(parsed)) {
                    // Old Format (array of parts only) -> Convert
                    validData = { 
                        builds: [{id:'import', name:'Imported Build', parts: parsed}], 
                        activeBuildId:'import'
                    };
                }

                if (validData) {
                    if(confirm("This will overwrite your current builds. Are you sure?")) {
                        appData = validData;
                        // Ensure active ID is valid
                        if(!appData.builds.find(b => b.id === appData.activeBuildId)) {
                             appData.activeBuildId = appData.builds[0].id;
                        }
                        saveData();
                        closeSettings();
                        alert("Builds loaded successfully!");
                    }
                } else {
                    alert("Invalid file format.");
                }
            } catch (e) {
                alert("Error parsing data. Make sure it is a valid PC Planner file.");
                console.error(e);
            }
        }

        // --- Rendering ---
        function renderApp() {
            renderTabs();
            renderList();
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            appData.builds.forEach(build => {
                const isActive = build.id === appData.activeBuildId;
                const btn = document.createElement('div');
                btn.className = `flex items-center px-4 py-2 rounded-lg border text-sm font-medium whitespace-nowrap cursor-pointer transition-all ${
                    isActive ? 'tab-active border-b-2' : 'tab-inactive border-transparent'
                }`;
                
                btn.innerHTML = `
                    <span onclick="switchTab('${build.id}')" class="mr-2">${escapeHtml(build.name)}</span>
                    <button onclick="renameTab('${build.id}')" class="opacity-50 hover:opacity-100 p-1 rounded-full hover:bg-white/10" title="Rename Build">
                        <i class="fa-solid fa-pencil text-xs"></i>
                    </button>
                `;
                
                tabsContainer.appendChild(btn);
            });
        }

        function renderList() {
            listContainer.innerHTML = '';
            const build = getActiveBuild();
            const parts = build.parts;

            activeBuildLabel.textContent = `Total: ${build.name}`;
            
            if (parts.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                parts.forEach(part => {
                    const card = document.createElement('div');
                    card.className = 'glass-panel p-4 rounded-xl flex items-center justify-between group transition-all hover:bg-slate-800/80';
                    
                    const formattedPrice = new Intl.NumberFormat('de-DE', { 
                        style: 'currency', 
                        currency: 'EUR' 
                    }).format(part.price);

                    const linkButton = part.link 
                        ? `<a href="${part.link}" target="_blank" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-cyan-600 text-cyan-400 hover:text-white flex items-center justify-center transition-colors">
                             <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                           </a>`
                        : `<div class="w-9 h-9 rounded-full bg-slate-800 text-slate-600 flex items-center justify-center cursor-not-allowed">
                             <i class="fa-solid fa-link-slash text-sm"></i>
                           </div>`;

                    card.innerHTML = `
                        <div class="flex-1 mr-4">
                            <h3 class="font-semibold text-white text-lg leading-tight">${escapeHtml(part.name)}</h3>
                            <p class="text-emerald-400 font-mono font-medium mt-1">${formattedPrice}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${linkButton}
                            
                            <button onclick="editPart(${part.id})" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-blue-600 text-slate-400 hover:text-white flex items-center justify-center transition-colors" title="Edit Item">
                                <i class="fa-solid fa-pencil text-sm"></i>
                            </button>

                            <button onclick="deletePart(${part.id})" class="w-9 h-9 rounded-full bg-slate-700 hover:bg-red-500/20 text-slate-400 hover:text-red-400 flex items-center justify-center transition-colors" title="Remove Item">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
            
            updateTotal(parts);
        }

        function updateTotal(parts) {
            const total = parts.reduce((sum, part) => sum + part.price, 0);
            
            totalPriceEl.textContent = new Intl.NumberFormat('de-DE', { 
                style: 'currency', 
                currency: 'EUR' 
            }).format(total);

            itemCountEl.textContent = `${parts.length} component${parts.length !== 1 ? 's' : ''}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>
</body>
</html>
