<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Part Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-field {
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 pb-24">

    <!-- Header -->
    <header class="w-full max-w-2xl mb-6 text-center">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
            <i class="fa-solid fa-microchip mr-2"></i>PC Build Planner
        </h1>
        <p class="text-slate-400 text-sm">Track your components and budget</p>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-2xl flex flex-col gap-6">
        
        <!-- Input Form -->
        <div class="glass-panel rounded-2xl p-5 shadow-xl">
            <form id="partForm" class="flex flex-col gap-4">
                
                <!-- Component Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Component</label>
                    <input type="text" id="partName" placeholder="e.g. NVIDIA RTX 4070" required
                        class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 placeholder-slate-500">
                </div>

                <div class="flex gap-4">
                    <!-- Price -->
                    <div class="w-1/3">
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Price (€)</label>
                        <input type="number" id="partPrice" placeholder="0.00" step="0.01" required
                            class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-3 placeholder-slate-500">
                    </div>

                    <!-- Link -->
                    <div class="w-2/3">
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Link URL</label>
                        <div class="relative">
                            <input type="text" id="partLink" placeholder="amazon.de/..."
                                class="input-field w-full bg-slate-800 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-3 placeholder-slate-500">
                            <i class="fa-solid fa-link absolute left-3.5 top-3.5 text-slate-500"></i>
                        </div>
                    </div>
                </div>

                <button type="submit" 
                    class="mt-2 w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95 shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Component
                </button>
            </form>
        </div>

        <!-- Parts List -->
        <div id="listContainer" class="flex flex-col gap-3">
            <!-- Items will be injected here by JS -->
            <div id="emptyState" class="text-center py-10 text-slate-500 hidden">
                <i class="fa-solid fa-layer-group text-4xl mb-3 opacity-50"></i>
                <p>No parts added yet. Start building!</p>
            </div>
        </div>

    </main>

    <!-- Sticky Footer Total -->
    <div class="fixed bottom-6 w-full max-w-2xl px-4 z-50">
        <div class="glass-panel rounded-xl p-4 shadow-2xl flex justify-between items-center border-t border-cyan-500/30">
            <div class="flex flex-col">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Total Budget</span>
                <span class="text-xs text-slate-500" id="itemCount">0 items</span>
            </div>
            <div class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500" id="totalPrice">
                0,00 €
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let parts = [];

        // --- DOM Elements ---
        const form = document.getElementById('partForm');
        const listContainer = document.getElementById('listContainer');
        const emptyState = document.getElementById('emptyState');
        const totalPriceEl = document.getElementById('totalPrice');
        const itemCountEl = document.getElementById('itemCount');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadParts();
            renderParts();
        });

        // --- Event Listeners ---
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            addPart();
        });

        // --- Core Functions ---

        function loadParts() {
            const saved = localStorage.getItem('pc_parts_list');
            if (saved) {
                parts = JSON.parse(saved);
            }
        }

        function saveParts() {
            localStorage.setItem('pc_parts_list', JSON.stringify(parts));
            renderParts();
        }

        function addPart() {
            const nameInput = document.getElementById('partName');
            const priceInput = document.getElementById('partPrice');
            const linkInput = document.getElementById('partLink');

            let linkUrl = linkInput.value.trim();
            
            // Smart Link Handling: Prepend https:// if missing
            if (linkUrl && !linkUrl.match(/^https?:\/\//i)) {
                linkUrl = 'https://' + linkUrl;
            }

            const newPart = {
                id: Date.now(),
                name: nameInput.value.trim(),
                price: parseFloat(priceInput.value),
                link: linkUrl
            };

            parts.push(newPart);
            saveParts();

            // Reset form and focus name
            form.reset();
            nameInput.focus();
        }

        function deletePart(id) {
            parts = parts.filter(part => part.id !== id);
            saveParts();
        }

        function renderParts() {
            listContainer.innerHTML = '';
            
            if (parts.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                parts.forEach(part => {
                    const card = document.createElement('div');
                    card.className = 'glass-panel p-4 rounded-xl flex items-center justify-between group transition-all hover:bg-slate-800/80';
                    
                    // Format price
                    const formattedPrice = new Intl.NumberFormat('de-DE', { 
                        style: 'currency', 
                        currency: 'EUR' 
                    }).format(part.price);

                    // Determine link button state
                    const linkButton = part.link 
                        ? `<a href="${part.link}" target="_blank" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-cyan-600 text-cyan-400 hover:text-white flex items-center justify-center transition-colors" title="Open Link">
                             <i class="fa-solid fa-arrow-up-right-from-square"></i>
                           </a>`
                        : `<div class="w-10 h-10 rounded-full bg-slate-800 text-slate-600 flex items-center justify-center cursor-not-allowed" title="No link provided">
                             <i class="fa-solid fa-link-slash"></i>
                           </div>`;

                    card.innerHTML = `
                        <div class="flex-1 mr-4">
                            <h3 class="font-semibold text-white text-lg leading-tight">${escapeHtml(part.name)}</h3>
                            <p class="text-emerald-400 font-mono font-medium mt-1">${formattedPrice}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            ${linkButton}
                            <button onclick="deletePart(${part.id})" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-red-500/20 text-slate-400 hover:text-red-400 flex items-center justify-center transition-colors" title="Remove Component">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
            
            updateTotal();
        }

        function updateTotal() {
            const total = parts.reduce((sum, part) => sum + part.price, 0);
            
            totalPriceEl.textContent = new Intl.NumberFormat('de-DE', { 
                style: 'currency', 
                currency: 'EUR' 
            }).format(total);

            itemCountEl.textContent = `${parts.length} component${parts.length !== 1 ? 's' : ''}`;
        }

        // Helper to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>
</body>
</html>
