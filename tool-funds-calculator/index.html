<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio value</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        zinc: {
                            850: '#1f1f22',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                } 
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
        }
        
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Custom Utilities */
        .lowercase-header { text-transform: lowercase; }
        
        .min-border { border: 1px solid #333; }
        
        .min-input {
            background-color: #000;
            border: 1px solid #333;
            color: #fff;
            transition: all 0.2s;
        }
        .min-input:focus {
            outline: none;
            border-color: #fff;
        }

        .min-btn {
            background-color: #000;
            border: 1px solid #333;
            color: #ccc;
            transition: all 0.2s;
            text-transform: lowercase;
        }
        .min-btn:hover:not(:disabled) {
            border-color: #fff;
            color: #fff;
            background-color: #111;
        }
        .min-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10b981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10b981;
        }

        .animate-spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 pb-20">
    <div id="root" class="w-full max-w-3xl"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // State
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('yh_fund_config');
                const parsed = saved ? JSON.parse(saved) : {};
                return {
                    apiKey: parsed.apiKey || '',
                    shares: parsed.shares || 100,
                    initialCost: parsed.initialCost || 1000.00,
                    ticker: parsed.ticker || '0P0001BUP5.F',
                    currentPrice: parsed.currentPrice || 10.00,
                    lastUpdate: parsed.lastUpdate || null,
                    useProxy: parsed.useProxy !== undefined ? parsed.useProxy : true,
                    proxyService: parsed.proxyService || 'thingproxy', // Default to thingproxy
                    showDebug: parsed.showDebug || false
                };
            });

            const [showSettings, setShowSettings] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            const [debugLog, setDebugLog] = useState([]);

            // Save to local storage
            useEffect(() => {
                localStorage.setItem('yh_fund_config', JSON.stringify(config));
            }, [config]);

            const log = (msg, data = null) => {
                const time = new Date().toLocaleTimeString();
                const newEntry = `[${time}] ${msg} ${data ? JSON.stringify(data) : ''}`;
                console.log(msg, data);
                setDebugLog(prev => [newEntry, ...prev].slice(0, 50));
            };

            const fetchYahooPrice = async () => {
                if (!config.apiKey) {
                    setError("please add your api key in settings");
                    setShowSettings(true);
                    return;
                }

                setIsLoading(true);
                setError(null);
                setDebugLog([]); // Clear log on new fetch
                log("Starting fetch...");

                const options = {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': config.apiKey,
                        'X-RapidAPI-Host': 'yahoo-finance15.p.rapidapi.com'
                    }
                };

                // Proxy Selection Logic
                const targetUrl = `https://yahoo-finance15.p.rapidapi.com/api/v1/markets/quote?ticker=${encodeURIComponent(config.ticker)}`;
                let finalUrl = targetUrl;

                if (config.useProxy) {
                    if (config.proxyService === 'corsproxy') {
                        finalUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                    } else if (config.proxyService === 'thingproxy') {
                        finalUrl = `https://thingproxy.freeboard.io/fetch/${targetUrl}`;
                    }
                }

                try {
                    log(`Proxy: ${config.useProxy ? config.proxyService : 'Disabled'}`);
                    log(`Target: ${targetUrl}`);
                    log(`Final URL: ${finalUrl}`);
                    
                    const response = await fetch(finalUrl, options);
                    log(`Response Status: ${response.status} ${response.statusText}`);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        log(`Error Body: ${errorText}`);
                        
                        // Handle Proxy Errors vs API Errors
                        if (errorText.includes("corsproxy")) throw new Error("Proxy Error: corsproxy.io rejected request. Try ThingProxy.");
                        if (response.status === 403) throw new Error("403 Forbidden (Check API Key or Proxy)");
                        if (response.status === 429) throw new Error("429 Too Many Requests");
                        if (response.status === 0) throw new Error("Network Error (CORS Blocked?)");
                        throw new Error(`API Status ${response.status}`);
                    }

                    const data = await response.json();
                    log("Data received", data);
                    
                    // --- Parsing Logic ---
                    let quote = null;

                    if (data.body && Array.isArray(data.body) && data.body.length > 0) {
                        quote = data.body[0];
                    } else if (Array.isArray(data) && data.length > 0) {
                         quote = data[0];
                    } else if (data.quoteResponse && data.quoteResponse.result) {
                        quote = data.quoteResponse.result[0];
                    } else if (typeof data === 'object') {
                         quote = data; 
                    }
                    
                    if (!quote) throw new Error("Empty data structure received");

                    // Check for price fields
                    const price = quote.regularMarketPrice || quote.price || quote.close || quote.preMarketPrice;

                    if (price !== undefined && price !== null) {
                        const newPrice = parseFloat(price);
                        log(`Price found: ${newPrice}`);
                        
                        setConfig(prev => ({
                            ...prev,
                            currentPrice: newPrice,
                            lastUpdate: new Date().toISOString()
                        }));
                    } else {
                        throw new Error("Price field missing in response");
                    }

                } catch (err) {
                    log(`EXCEPTION: ${err.message}`);
                    
                    if (err.name === 'TypeError' && err.message === 'Failed to fetch') {
                        setError("network error: browser blocked request. try checking proxy settings.");
                    } else {
                        setError(`error: ${err.message}`);
                    }
                } finally {
                    setIsLoading(false);
                    log("Fetch complete");
                }
            };

            // Calculations
            const currentValue = config.shares * config.currentPrice;
            const profitEuro = currentValue - config.initialCost;
            const profitPercent = (profitEuro / config.initialCost) * 100;
            const isProfit = profitEuro >= 0;

            const fmt = (val) => new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(val);

            return (
                <div className="w-full flex flex-col gap-8">
                    
                    {/* Header */}
                    <header className="flex flex-col gap-4">
                        <div className="flex justify-between items-center">
                            <h1 className="text-3xl font-light lowercase-header tracking-tight">portfolio value</h1>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowSettings(!showSettings)} 
                                    className="text-zinc-500 hover:text-white transition-colors"
                                    title="settings"
                                >
                                    <i className="fa-solid fa-gear"></i>
                                </button>
                                <button 
                                    onClick={fetchYahooPrice} 
                                    disabled={isLoading}
                                    className="text-zinc-500 hover:text-white transition-colors disabled:opacity-50"
                                    title="refresh"
                                >
                                    <i className={`fa-solid fa-rotate-right ${isLoading ? 'animate-spin-slow' : ''}`}></i>
                                </button>
                            </div>
                        </div>
                        <hr className="border-zinc-800" />
                    </header>

                    {/* Main Display */}
                    <div className="flex flex-col gap-1">
                        <span className="text-sm text-zinc-500 lowercase-header">current value</span>
                        <div className="text-5xl font-light tracking-tight text-white transition-all duration-300">
                            {fmt(currentValue)}
                        </div>
                    </div>

                    {/* Quick Stats Grid */}
                    <div className="grid grid-cols-2 gap-4">
                        <div className="p-4 min-border">
                            <p className="text-xs text-zinc-500 lowercase-header mb-1">profit/loss</p>
                            <p className={`text-xl font-light ${isProfit ? 'text-emerald-500' : 'text-red-500'}`}>
                                {isProfit ? '+' : ''}{fmt(profitEuro)}
                            </p>
                        </div>
                        <div className="p-4 min-border">
                            <p className="text-xs text-zinc-500 lowercase-header mb-1">return</p>
                            <div className="flex items-center gap-2">
                                <p className={`text-xl font-light ${isProfit ? 'text-emerald-500' : 'text-red-500'}`}>
                                    {isProfit ? '+' : ''}{profitPercent.toFixed(2)}%
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Settings Panel */}
                    {showSettings && (
                        <div className="p-6 border border-zinc-800 bg-black animate-in fade-in slide-in-from-top-2">
                            <h2 className="text-sm font-medium text-white mb-4 lowercase-header">configuration</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs text-zinc-500 lowercase-header block mb-2">rapidapi key</label>
                                    <input 
                                        type="password" 
                                        placeholder="paste key here..."
                                        className="min-input w-full px-3 py-2 text-sm rounded"
                                        value={config.apiKey}
                                        onChange={(e) => setConfig({...config, apiKey: e.target.value})}
                                    />
                                </div>
                                <div>
                                    <label className="text-xs text-zinc-500 lowercase-header block mb-2">ticker symbol</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. AAPL, 0P0001BUP5.F"
                                        className="min-input w-full px-3 py-2 text-sm rounded uppercase"
                                        value={config.ticker}
                                        onChange={(e) => setConfig({...config, ticker: e.target.value})}
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-zinc-500 lowercase-header block mb-2">shares</label>
                                        <input 
                                            type="number" 
                                            className="min-input w-full px-3 py-2 text-sm rounded"
                                            value={config.shares}
                                            onChange={(e) => setConfig({...config, shares: parseFloat(e.target.value) || 0})}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-500 lowercase-header block mb-2">total cost (€)</label>
                                        <input 
                                            type="number" 
                                            className="min-input w-full px-3 py-2 text-sm rounded"
                                            value={config.initialCost}
                                            onChange={(e) => setConfig({...config, initialCost: parseFloat(e.target.value) || 0})}
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs text-zinc-500 lowercase-header block mb-2">current price (€) [Manual]</label>
                                    <input 
                                        type="number" 
                                        step="0.01"
                                        className="min-input w-full px-3 py-2 text-sm rounded"
                                        value={config.currentPrice}
                                        onChange={(e) => setConfig({...config, currentPrice: parseFloat(e.target.value) || 0})}
                                    />
                                </div>

                                <div className="border-t border-zinc-800 pt-3">
                                    <div className="flex items-center gap-3 mb-2">
                                        <input 
                                            type="checkbox" 
                                            id="useProxy"
                                            checked={config.useProxy}
                                            onChange={(e) => setConfig({...config, useProxy: e.target.checked})}
                                            className="w-4 h-4 rounded border-zinc-700 bg-black text-emerald-500 focus:ring-0"
                                        />
                                        <label htmlFor="useProxy" className="text-xs text-zinc-400 lowercase-header select-none cursor-pointer">
                                            use cors proxy
                                        </label>
                                    </div>

                                    {config.useProxy && (
                                        <div className="mb-3">
                                            <label className="text-xs text-zinc-500 lowercase-header block mb-1 ml-7">proxy service</label>
                                            <select 
                                                value={config.proxyService}
                                                onChange={(e) => setConfig({...config, proxyService: e.target.value})}
                                                className="min-input w-full ml-7 w-[calc(100%-1.75rem)] px-2 py-1 text-xs rounded"
                                            >
                                                <option value="thingproxy">ThingProxy (Recommended)</option>
                                                <option value="corsproxy">CorsProxy.io (Limit Issues)</option>
                                            </select>
                                        </div>
                                    )}

                                    <div className="flex items-center gap-3">
                                        <input 
                                            type="checkbox" 
                                            id="showDebug"
                                            checked={config.showDebug}
                                            onChange={(e) => setConfig({...config, showDebug: e.target.checked})}
                                            className="w-4 h-4 rounded border-zinc-700 bg-black text-emerald-500 focus:ring-0"
                                        />
                                        <label htmlFor="showDebug" className="text-xs text-zinc-400 lowercase-header select-none cursor-pointer">
                                            show debug log
                                        </label>
                                    </div>
                                </div>
                                
                                <div className="pt-2">
                                    <button 
                                        onClick={() => setShowSettings(false)}
                                        className="min-btn w-full py-2 text-sm rounded font-medium border-zinc-600 hover:border-white"
                                    >
                                        close & apply
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <hr className="border-zinc-800" />

                    {/* Debug Log Output */}
                    {config.showDebug && debugLog.length > 0 && (
                        <div className="w-full p-4 bg-zinc-900 rounded border border-zinc-800 font-mono text-[10px] text-zinc-400 overflow-x-auto">
                            <p className="text-white mb-2 border-b border-zinc-800 pb-1">Debug Log</p>
                            {debugLog.map((entry, i) => (
                                <div key={i} className="whitespace-pre-wrap mb-1">{entry}</div>
                            ))}
                        </div>
                    )}

                    {/* Fund Detail */}
                    <div className="flex flex-col gap-4">
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="font-medium text-lg lowercase-header text-white">portfolio asset</h3>
                                <p className="text-xs text-zinc-500 font-mono mt-1">{config.ticker}</p>
                            </div>
                            <div className="text-right">
                                <p className="text-xl font-light text-white">{fmt(config.currentPrice)}</p>
                                <p className="text-xs text-zinc-500 lowercase-header">latest price</p>
                            </div>
                        </div>

                        <div className="space-y-2 pt-4 border-t border-zinc-900">
                            <div className="flex justify-between text-sm">
                                <span className="text-zinc-500 lowercase-header">holdings</span>
                                <span className="text-zinc-300 font-mono">{config.shares.toFixed(4)}</span>
                            </div>
                            <div className="flex justify-between text-sm">
                                <span className="text-zinc-500 lowercase-header">break-even</span>
                                <span className="text-zinc-300 font-mono">{fmt(config.initialCost / config.shares)}</span>
                            </div>
                            <div className="flex justify-between text-sm">
                                <span className="text-zinc-500 lowercase-header">last update</span>
                                <span className="text-zinc-500 font-mono text-xs">
                                    {config.lastUpdate ? new Date(config.lastUpdate).toLocaleTimeString() : 'never'}
                                </span>
                            </div>
                        </div>
                    </div>

                    {error && (
                        <div className="mt-4 p-3 border border-red-900/50 text-red-400 text-xs text-center font-mono lowercase-header">
                            {error}
                        </div>
                    )}
                    
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
