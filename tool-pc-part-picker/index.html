<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc part picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 0px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .min-input {
            background-color: #000;
            border: 1px solid #333;
            color: #fff;
            transition: all 0.2s;
            border-radius: 4px;
        }
        .min-input:focus {
            outline: none;
            border-color: #fff;
        }

        .min-btn {
            background-color: #000;
            border: 1px solid #333;
            color: #ccc;
            transition: all 0.2s;
            border-radius: 4px;
            text-transform: lowercase;
        }
        .min-btn:hover {
            border-color: #fff;
            color: #fff;
            background-color: #111;
        }
        .min-btn-primary {
            background-color: #fff;
            border: 1px solid #fff;
            color: #000;
            font-weight: 500;
        }
        .min-btn-primary:hover {
            background-color: #ddd;
            border-color: #ddd;
        }

        .tab-active {
            border-bottom: 1px solid #fff;
            color: #fff;
        }
        .tab-inactive {
            color: #666;
            border-bottom: 1px solid transparent;
        }
        .tab-inactive:hover {
            color: #999;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(2px);
        }

        hr { border-color: #333; }
        .lowercase-header { text-transform: lowercase; }

        .loader {
            border: 2px solid #333;
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Tooltip container */
        .tooltip-container {
            position: relative;
            display: inline-block;
        }
        
        .tooltip-container .tooltip-text {
            visibility: hidden;
            width: 120px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 4px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%; /* Position above */
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 10px;
            pointer-events: none;
        }
        
        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        /* Share Feedback Animation */
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        .share-feedback {
            animation: fadeOut 2s forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 pb-32 max-w-3xl mx-auto">

    <!-- Header -->
    <header class="w-full mb-8 flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-light lowercase-header tracking-tight">pc part picker</h1>
            <div class="flex gap-4">
                <button onclick="shareCurrentBuild()" id="shareBtn" class="text-zinc-500 hover:text-white transition-colors relative" title="share build link">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
                <button onclick="openSettings()" class="text-zinc-500 hover:text-white transition-colors" title="settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
        <hr />
    </header>

    <!-- Main Content -->
    <main class="w-full flex flex-col gap-8">

        <!-- Tabs -->
        <div class="flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="text-sm text-zinc-500 lowercase-header">builds</span>
                <button onclick="createNewBuild()" class="text-xs text-white border border-zinc-700 px-2 py-1 hover:bg-zinc-900 rounded lowercase-header">
                    + new
                </button>
            </div>
            <div class="flex gap-4 overflow-x-auto pb-1" id="tabsContainer"></div>
        </div>
        
        <!-- Input Form -->
        <div class="w-full relative">
            <div id="editModeIndicator" class="hidden absolute -top-6 left-0 text-xs text-white bg-zinc-800 px-2 py-0.5 rounded lowercase-header">
                editing component...
            </div>

            <form id="partForm" class="flex flex-col gap-3">
                <input type="hidden" id="editId" value="">

                <div class="flex gap-3">
                    <div class="flex-grow">
                        <input type="text" id="partName" placeholder="component name (e.g. gpu)" required
                            class="min-input w-full px-3 py-2 text-sm placeholder-zinc-600">
                    </div>
                </div>

                <div class="flex gap-3">
                    <div class="w-1/3">
                        <input type="number" id="partPrice" placeholder="price €" step="0.01" required
                            class="min-input w-full px-3 py-2 text-sm placeholder-zinc-600">
                    </div>

                    <div class="w-2/3 relative">
                        <input type="text" id="partLink" placeholder="paste tweakers link to autofill"
                            class="min-input w-full px-3 py-2 text-sm placeholder-zinc-600 pr-10">
                        <div id="fetchStatus" class="tooltip-container absolute right-3 top-1/2 -translate-y-1/2 text-xs flex items-center cursor-help">
                            <i class="fa-solid fa-link text-zinc-500"></i>
                            <span id="fetchTooltip" class="tooltip-text">auto-fetch ready</span>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="submit" id="submitBtn" class="min-btn min-btn-primary w-full py-2 text-sm">
                        add component
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden min-btn w-1/4 py-2 text-sm text-red-400 border-red-900">
                        cancel
                    </button>
                </div>
            </form>
        </div>

        <hr />

        <!-- Parts List -->
        <div id="listContainer" class="flex flex-col gap-2">
            <div id="emptyState" class="text-center py-12 text-zinc-700 lowercase-header">
                no parts added yet
            </div>
        </div>

        <div class="flex justify-center mt-4">
             <button onclick="deleteCurrentBuild()" class="text-zinc-700 hover:text-red-700 text-xs transition-colors lowercase-header">delete build</button>
        </div>
    </main>

    <!-- Footer Total -->
    <div class="fixed bottom-0 left-0 w-full border-t border-zinc-800 bg-black/95 backdrop-blur-sm z-40">
        <div class="max-w-3xl mx-auto p-4 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-xs text-zinc-500 lowercase-header" id="activeBuildLabel">total budget</span>
                <span class="text-xs text-zinc-600 lowercase-header" id="itemCount">0 items</span>
            </div>
            <div class="text-xl font-medium text-white" id="totalPrice">
                0,00 €
            </div>
        </div>
    </div>

    <!-- Data Modal -->
    <div id="dataModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-black border border-zinc-800 p-6 w-full max-w-md shadow-2xl relative">
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-lg font-light lowercase-header mb-6">import / export</h2>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="downloadDataFile()" class="min-btn py-4 flex flex-col items-center justify-center gap-2 group">
                    <i class="fa-solid fa-download text-zinc-500 group-hover:text-white"></i>
                    <span class="text-xs">download .txt</span>
                </button>
                <label class="min-btn py-4 flex flex-col items-center justify-center gap-2 cursor-pointer group">
                    <i class="fa-solid fa-file-import text-zinc-500 group-hover:text-white"></i>
                    <span class="text-xs">import .txt</span>
                    <input type="file" id="fileInput" onchange="importDataFile(this)" accept=".txt,.json" class="hidden">
                </label>
            </div>
            <div class="border-t border-zinc-900 pt-4">
                <button onclick="toggleManualMode()" class="text-xs text-zinc-600 hover:text-zinc-400 w-full text-center lowercase-header">manual copy/paste</button>
                <div id="manualSection" class="hidden mt-4">
                    <textarea id="dataExportArea" class="min-input w-full h-24 p-2 text-xs font-mono mb-2" readonly></textarea>
                    <button onclick="copyToClipboard()" class="min-btn w-full py-1 text-xs mb-4">copy text</button>
                    <div class="flex gap-2">
                        <input type="text" id="manualInput" class="min-input flex-1 px-2 py-1 text-xs font-mono" placeholder="paste data...">
                        <button onclick="importManualData()" class="min-btn px-4 py-1 text-xs">load</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'pc_planner_data_v5';
        let appData = {
            builds: [{ id: 'default', name: 'my build', parts: [] }],
            activeBuildId: 'default'
        };

        const form = document.getElementById('partForm');
        const listContainer = document.getElementById('listContainer');
        const emptyState = document.getElementById('emptyState');
        const totalPriceEl = document.getElementById('totalPrice');
        const itemCountEl = document.getElementById('itemCount');
        const tabsContainer = document.getElementById('tabsContainer');
        const activeBuildLabel = document.getElementById('activeBuildLabel');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editModeIndicator = document.getElementById('editModeIndicator');
        const fetchStatus = document.getElementById('fetchStatus');
        const fetchTooltip = document.getElementById('fetchTooltip');
        const partLinkInput = document.getElementById('partLink');

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            checkForSharedLink(); // Check if this is a shared URL
            renderApp();
            partLinkInput.addEventListener('input', handleLinkInput);
        });

        // --- Share & Link Logic ---
        function shareCurrentBuild() {
            const build = getActiveBuild();
            if(!build || build.parts.length === 0) {
                alert("Add some parts before sharing!");
                return;
            }

            // Encode build data to base64 for URL
            try {
                const jsonStr = JSON.stringify(build);
                // Use unescape+encodeURIComponent to handle Unicode (Euro symbol) correctly in btoa
                const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
                
                const baseUrl = window.location.href.split('?')[0];
                const shareUrl = `${baseUrl}?build=${encoded}`;

                navigator.clipboard.writeText(shareUrl).then(() => {
                    const btn = document.getElementById('shareBtn');
                    const originalHTML = btn.innerHTML;
                    
                    // Show feedback
                    btn.innerHTML = '<i class="fa-solid fa-check text-green-500"></i>';
                    
                    // Add floating label
                    const label = document.createElement('div');
                    label.textContent = 'link copied!';
                    label.className = 'absolute -bottom-8 left-1/2 -translate-x-1/2 text-[10px] text-green-500 whitespace-nowrap share-feedback';
                    btn.appendChild(label);

                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                    }, 2000);
                });
            } catch(e) {
                console.error("Encoding failed", e);
                alert("Failed to generate link");
            }
        }

        function checkForSharedLink() {
            const params = new URLSearchParams(window.location.search);
            const encodedBuild = params.get('build');

            if (encodedBuild) {
                try {
                    // Decode
                    const jsonStr = decodeURIComponent(escape(window.atob(encodedBuild)));
                    const sharedBuild = JSON.parse(jsonStr);

                    if (sharedBuild && Array.isArray(sharedBuild.parts)) {
                        // Give it a unique ID so it doesn't clash
                        sharedBuild.id = 'import_' + Date.now();
                        sharedBuild.name = `shared: ${sharedBuild.name}`;

                        // Add to builds
                        appData.builds.push(sharedBuild);
                        appData.activeBuildId = sharedBuild.id;
                        
                        saveData();
                        
                        // Clean URL without refresh
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        // Alert user (optional, but good for UX)
                        // setTimeout(() => alert(`Imported build: ${sharedBuild.name}`), 100);
                    }
                } catch (e) {
                    console.error("Import failed", e);
                    alert("Invalid share link");
                }
            }
        }

        // --- Tweakers Auto Fetch & Rotation Logic ---
        let fetchTimeout;
        
        function handleLinkInput(e) {
            const url = e.target.value.trim();
            clearTimeout(fetchTimeout);
            
            fetchStatus.querySelector('i').className = 'fa-solid fa-link text-zinc-500';
            fetchTooltip.textContent = "auto-fetch ready";

            if (url.includes('tweakers.net/pricewatch')) {
                fetchTimeout = setTimeout(() => fetchTweakersData(url), 600);
            }
        }

        async function fetchTweakersData(url) {
            const icon = fetchStatus.querySelector('i');
            
            // Set loading state
            icon.className = ''; 
            fetchStatus.querySelector('div')?.remove(); 
            const loader = document.createElement('div');
            loader.className = 'loader';
            fetchStatus.prepend(loader);
            fetchTooltip.textContent = "fetching...";

            // PROXY ROTATION STRATEGY
            // 1. CorsProxy.io (Fast, often bypasses basic checks)
            // 2. AllOrigins (Fallback, robust JSONP-style but often hit by Cloudflare)
            const proxies = [
                {
                    name: 'corsproxy',
                    url: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}`,
                    type: 'html'
                },
                {
                    name: 'allorigins',
                    url: (target) => `https://api.allorigins.win/get?url=${encodeURIComponent(target)}&disableCache=true`,
                    type: 'json'
                }
            ];

            let lastError = null;

            for (const proxy of proxies) {
                try {
                    console.log(`Trying proxy: ${proxy.name}`);
                    const res = await fetch(proxy.url(url));
                    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);

                    let htmlContent = "";
                    if (proxy.type === 'json') {
                        const data = await res.json();
                        if (!data.contents) throw new Error("No content in JSON");
                        htmlContent = data.contents;
                    } else {
                        htmlContent = await res.text();
                    }

                    // --- PARSING & VALIDATION ---
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlContent, "text/html");
                    
                    // CHECK FOR CLOUDFLARE / BOT BLOCK
                    const pageTitle = doc.title.toLowerCase();
                    const bodyText = doc.body.innerText.toLowerCase();
                    
                    if (
                        pageTitle.includes('just a moment') || 
                        pageTitle.includes('attention required') || 
                        pageTitle.includes('access denied') ||
                        bodyText.includes('checking your browser') ||
                        bodyText.includes('cloudflare')
                    ) {
                        console.warn(`Blocked by Cloudflare via ${proxy.name}`);
                        throw { type: 'cloudflare' }; // Trigger rotation to next proxy
                    }

                    if (pageTitle.includes('cookie') || pageTitle.includes('consent') || bodyText.includes('cookies op tweakers')) {
                        throw { type: 'cookie' }; // Cookie wall is a hard stop usually, but maybe next proxy has different IP?
                    }

                    // --- SUCCESSFUL HTML RETRIEVAL ---
                    const result = parseTweakersHTML(doc);
                    
                    if (result.price) {
                        // Apply Data
                        document.getElementById('partPrice').value = result.price;
                        if (document.getElementById('partName').value === "") {
                            document.getElementById('partName').value = result.name.toLowerCase();
                        }
                        
                        loader.remove();
                        icon.className = 'fa-solid fa-circle-check text-green-500';
                        fetchTooltip.textContent = `found via ${proxy.name}`;
                        return; // EXIT FUNCTION ON SUCCESS
                    } else if (result.isExpected) {
                        throw { type: 'expected' };
                    }
                    
                    // If we got HTML but no price, try next proxy just in case layout was mangled
                    throw { type: 'noprice' };

                } catch (e) {
                    console.error(`Proxy ${proxy.name} failed:`, e);
                    lastError = e;
                    // Loop continues to next proxy...
                }
            }

            // --- ALL PROXIES FAILED ---
            loader.remove();
            if (lastError.type === 'cookie') {
                icon.className = 'fa-solid fa-cookie-bite text-orange-500';
                fetchTooltip.textContent = "blocked by cookie wall";
            } else if (lastError.type === 'expected') {
                icon.className = 'fa-regular fa-clock text-blue-400';
                fetchTooltip.textContent = "coming soon (no price)";
            } else if (lastError.type === 'cloudflare') {
                icon.className = 'fa-solid fa-shield-halved text-orange-500';
                fetchTooltip.textContent = "blocked by cloudflare";
            } else if (lastError.type === 'noprice') {
                icon.className = 'fa-solid fa-triangle-exclamation text-yellow-500';
                fetchTooltip.textContent = "price not found";
            } else {
                icon.className = 'fa-solid fa-circle-xmark text-red-500';
                fetchTooltip.textContent = "network/proxy error";
            }
        }

        function parseTweakersHTML(doc) {
            // Title Extraction
            const titleSelectors = ['h1', 'meta[property="og:title"]', '.product-header__title', '.entity-header__title'];
            let name = "";
            for (const sel of titleSelectors) {
                const el = doc.querySelector(sel);
                if (el) {
                    name = (sel.startsWith('meta') ? el.content : el.innerText)
                        .replace(/ - Kenmerken - Tweakers| - Prijzen - Tweakers| - Tweakers/g, '')
                        .trim();
                    if (name) break;
                }
            }

            // Price Extraction
            let rawPrice = "";
            let isExpected = false;

            // Strategy A: Metadata
            const metaPrice = doc.querySelector('meta[itemprop="price"]');
            if (metaPrice) rawPrice = metaPrice.content;

            // Strategy B: JSON-LD
            if (!rawPrice) {
                const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
                for (const script of scripts) {
                    try {
                        const json = JSON.parse(script.innerText);
                        if (json['@type'] === 'Product' && json.offers) {
                            if (json.offers.price) rawPrice = json.offers.price;
                            else if (json.offers.lowPrice) rawPrice = json.offers.lowPrice;
                            else if (Array.isArray(json.offers)) {
                                const offer = json.offers.find(o => o.price || o.lowPrice);
                                if(offer) rawPrice = offer.price || offer.lowPrice;
                            }
                        }
                    } catch(e) {}
                }
            }

            // Strategy C: Visual
            if (!rawPrice) {
                const priceSelectors = ['.best-price-summary__price', '.price-summary__price', '.shop-price', '.poster__price', '.entity-header__price', 'td.price'];
                for (const sel of priceSelectors) {
                    const el = doc.querySelector(sel);
                    if (el) { rawPrice = el.innerText; break; }
                }
            }

            // Strategy D: Description
            if (!rawPrice) {
                const metaDesc = doc.querySelector('meta[name="description"]')?.content;
                if (metaDesc) {
                    const match = metaDesc.match(/(?:voor|vanaf)\s*€\s*([\d.,]+)/i);
                    if (match && match[1]) rawPrice = match[1];
                    else if (metaDesc.toLowerCase().includes('wordt verwacht') || metaDesc.toLowerCase().includes('geen prijzen')) {
                        isExpected = true;
                    }
                }
            }

            let finalPrice = null;
            if (rawPrice) {
                let clean = rawPrice.toString().replace(/[€\s]/g, '');
                
                // FIXED PARSING LOGIC FOR "2 Zeros" ISSUE
                if (clean.includes(',-')) {
                    // Dutch Integer Format: 1.299,-
                    clean = clean.replace(',-', ''); // Remove suffix: 1.299
                    clean = clean.replace(/\./g, ''); // Remove thousands dots: 1299
                } else if (clean.includes(',')) {
                    // Dutch Decimal Format: 1.299,95
                    clean = clean.replace(/\./g, ''); // Remove thousands dots: 1299,95
                    clean = clean.replace(',', '.');  // Decimal: 1299.95
                } else {
                    // Standard Format: 1299.95 or 1299 (JSON-LD)
                    // Do not strip dots, they are decimals here
                }

                const p = parseFloat(clean);
                if (!isNaN(p)) finalPrice = p;
            }

            return { name, price: finalPrice, isExpected };
        }

        // --- App Logic ---
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.builds) appData = parsed;
                } catch(e) {}
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            renderApp();
        }

        function getActiveBuild() {
            return appData.builds.find(b => b.id === appData.activeBuildId) || appData.builds[0];
        }

        function createNewBuild() {
            const name = prompt("name for new build:");
            if (name) {
                const newId = Date.now().toString();
                appData.builds.push({ id: newId, name: name.toLowerCase(), parts: [] });
                appData.activeBuildId = newId;
                saveData();
            }
        }

        function switchTab(id) {
            appData.activeBuildId = id;
            cancelEdit();
            saveData();
        }

        function renameTab(id) {
            const build = appData.builds.find(b => b.id === id);
            if (!build) return;
            const newName = prompt("rename build:", build.name);
            if (newName) {
                build.name = newName.toLowerCase();
                saveData();
            }
        }

        function deleteCurrentBuild() {
            if (appData.builds.length <= 1) return;
            if(confirm("delete this build?")) {
                appData.builds = appData.builds.filter(b => b.id !== appData.activeBuildId);
                appData.activeBuildId = appData.builds[0].id;
                saveData();
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const build = getActiveBuild();
            const idInput = document.getElementById('editId');
            const nameVal = document.getElementById('partName').value.trim().toLowerCase();
            const priceVal = parseFloat(document.getElementById('partPrice').value);
            const linkVal = document.getElementById('partLink').value.trim();

            if (idInput.value) {
                const part = build.parts.find(p => p.id == idInput.value);
                if (part) {
                    part.name = nameVal;
                    part.price = priceVal;
                    part.link = linkVal;
                }
            } else {
                build.parts.push({ id: Date.now(), name: nameVal, price: priceVal, link: linkVal });
            }
            cancelEdit();
            saveData();
        });

        function editPart(id) {
            const part = getActiveBuild().parts.find(p => p.id === id);
            if(!part) return;
            document.getElementById('editId').value = part.id;
            document.getElementById('partName').value = part.name;
            document.getElementById('partPrice').value = part.price;
            document.getElementById('partLink').value = part.link;
            submitBtn.textContent = 'save changes';
            cancelEditBtn.classList.remove('hidden');
            editModeIndicator.classList.remove('hidden');
        }

        function cancelEdit() {
            form.reset();
            document.getElementById('editId').value = "";
            submitBtn.textContent = 'add component';
            cancelEditBtn.classList.add('hidden');
            editModeIndicator.classList.add('hidden');
            fetchStatus.querySelector('i').className = 'fa-solid fa-link text-zinc-500';
            fetchTooltip.textContent = "auto-fetch ready";
        }

        function deletePart(id) {
            const build = getActiveBuild();
            build.parts = build.parts.filter(p => p.id !== id);
            saveData();
        }

        function renderApp() {
            tabsContainer.innerHTML = '';
            appData.builds.forEach(build => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 text-sm whitespace-nowrap lowercase-header ${build.id === appData.activeBuildId ? 'tab-active' : 'tab-inactive'}`;
                btn.onclick = () => switchTab(build.id);
                btn.ondblclick = () => renameTab(build.id);
                btn.textContent = build.name;
                tabsContainer.appendChild(btn);
            });

            listContainer.innerHTML = '';
            const build = getActiveBuild();
            if (build.parts.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                build.parts.forEach(part => {
                    const card = document.createElement('div');
                    card.className = 'flex items-center justify-between py-3 border-b border-zinc-900';
                    const formatted = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(part.price);
                    card.innerHTML = `
                        <div class="flex-1">
                            <h3 class="text-white text-sm lowercase-header">${part.name}</h3>
                            <p class="text-zinc-500 font-mono text-xs">${formatted}</p>
                        </div>
                        <div class="flex gap-2">
                            ${part.link ? `<a href="${part.link}" target="_blank" class="text-zinc-500 hover:text-white px-2"><i class="fa-solid fa-up-right-from-square text-xs"></i></a>` : ''}
                            <button onclick="editPart(${part.id})" class="text-zinc-600 hover:text-zinc-400 px-1"><i class="fa-solid fa-pencil text-xs"></i></button>
                            <button onclick="deletePart(${part.id})" class="text-zinc-600 hover:text-red-500 px-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>`;
                    listContainer.appendChild(card);
                });
            }
            const total = build.parts.reduce((s, p) => s + p.price, 0);
            totalPriceEl.textContent = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(total);
            itemCountEl.textContent = `${build.parts.length} items`;
            activeBuildLabel.textContent = `total: ${build.name}`;
        }

        // --- Settings / Data ---
        function openSettings() { 
            document.getElementById('dataExportArea').value = JSON.stringify(appData);
            document.getElementById('dataModal').classList.remove('hidden'); 
        }
        function closeSettings() { document.getElementById('dataModal').classList.add('hidden'); }
        function toggleManualMode() { document.getElementById('manualSection').classList.toggle('hidden'); }
        function downloadDataFile() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "text/plain" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `pc_build_backup.txt`;
            a.click();
        }
        function importDataFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.builds && confirm("overwrite data?")) { appData = parsed; saveData(); closeSettings(); }
                } catch(e) { alert("invalid file"); }
            };
            reader.readAsText(input.files[0]);
        }
        function copyToClipboard() {
            const area = document.getElementById('dataExportArea');
            area.select();
            document.execCommand('copy');
        }
        function importManualData() {
            const val = document.getElementById('manualInput').value;
            try {
                const parsed = JSON.parse(val);
                if(parsed.builds && confirm("overwrite data?")) { appData = parsed; saveData(); closeSettings(); }
            } catch(e) { alert("invalid format"); }
        }
    </script>
</body>
</html>
